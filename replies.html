<!DOCTYPE html>
<html lang="es" data-theme="day">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>bitchat/@ForecastQuant · respuestas</title>
<meta name="theme-color" content="#ffffff" />
<meta name="color-scheme" content="light dark" />
<style>
:root,html[data-theme="day"]{--bg:#fff;--g1:#1B7F1B;--g2:#4C9A4C;--blue:#3b66c4;--line:#d9d9d9;--sel:#eef7ee}
html[data-theme="night"]{--bg:#0b0d0b;--g1:#4fd34f;--g2:#6fae6f;--blue:#7aa2ff;--line:#2a2f2a;--sel:#142014}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--g1);font-family:ui-monospace,"SF Mono","JetBrains Mono","IBM Plex Mono",Menlo,Consolas,monospace;font-size:15px;line-height:1.55}
a{color:var(--blue);text-decoration:none}a:hover{text-decoration:underline}
button{font:inherit;color:var(--blue);background:none;border:0;padding:0;cursor:pointer}
button:hover{text-decoration:underline}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:20px 18px 14px;border-bottom:1px solid var(--line)}
.title{font-size:24px;font-weight:600;color:var(--g1)}
.bar{display:flex;align-items:center;gap:16px}
.bar svg{width:18px;height:18px;stroke:var(--g2);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
main{max-width:860px;padding:14px 18px 60px}
.sys{color:var(--g2);margin:6px 0}
.sys.strong{color:var(--g1)}
.msg{margin:22px 0 0;padding-top:14px;border-top:1px solid var(--line)}
.who{color:var(--g1);font-weight:600}
.who a{color:var(--g1)}
.time{color:var(--g2);margin-left:6px}
.tag{color:var(--blue);margin-left:8px}
.new{color:var(--blue);font-weight:600}
.lbl{color:var(--g2);margin-top:10px}
.txt{color:var(--g1);white-space:pre-wrap;word-break:break-word;margin:2px 0 0}
.draft{margin-top:10px;padding-left:12px;border-left:2px solid var(--g2)}
.draft pre{margin:2px 0 0;font:inherit;color:var(--g1);white-space:pre-wrap;word-break:break-word}
.row{display:flex;gap:14px;flex-wrap:wrap;color:var(--g2)}
.note{color:var(--g2);margin-top:8px}
@media(max-width:560px){.title{font-size:20px}body{font-size:14px}}
</style>
</head>
<body>
<header>
  <div class="title">bitchat/@ForecastQuant</div>
  <div class="bar">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3h6l-1 6 3 3H7l3-3-1-6zM12 12v9"/></svg>
    <span class="tag" style="margin:0">#respuestas</span>
    <button type="button" id="refresh" title="actualizar datos">↻ actualizar</button>
    <button type="button" id="theme-toggle" title="cambiar tema">☀ día</button>
  </div>
</header>
<main>
  <div class="sys">* estás en #respuestas — borradores en inglés para tus respuestas en X *</div>
  <div class="sys">* nada se publica desde aquí: copia el borrador y publícalo tú en X *</div>
  <div class="sys strong" id="meta">* cargando datos… *</div>
  <div class="sys strong" id="summary"></div>
  <div class="row"><button type="button" data-o="new">[más recientes]</button><button type="button" data-o="old">[más antiguas]</button><a href="./index.html">[← board principal]</a></div>
  <section id="replies"></section>
</main>
<script>
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
async function copyDraft(btn,text){try{await navigator.clipboard.writeText(text)}catch(e){const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove()}const p=btn.textContent;btn.textContent='[¡copiado!]';setTimeout(()=>{btn.textContent=p},1400)}
let D,O='new';const H=3600e3;function isNew(p){return p.new===true||Date.now()-new Date(p.date)<=6*H}
function blk(lbl,id,t){return`<div class="draft"><div class="lbl">${lbl} <button type="button" class="cp" data-draft-id="${id}">[copiar borrador]</button></div><pre id="${id}">${esc(t)}</pre></div>`}
function render(){const rs=D.replies.filter(p=>Date.now()-new Date(p.date)<=24*H).sort((a,b)=>(new Date(b.date)-new Date(a.date))*(O==='new'?1:-1));
document.getElementById('replies').innerHTML=rs.map(p=>{const d=new Date(p.date).toLocaleString('es-CL',{timeZone:'America/Santiago',dateStyle:'medium',timeStyle:'short'});
return`<article class="msg"><div><span class="who"><a href="${esc(p.post_url)}" target="_blank" rel="noopener">@${esc(p.handle)}</a></span><span class="time">${esc(d)} (Chile)</span><span class="tag">#${esc(String(p.status).toLowerCase().replace(/\s+/g,'-'))}</span>${isNew(p)?'<span class="tag new">* NUEVA *</span>':''}</div>
<div class="lbl">tu post</div><div class="txt">${esc(p.user_post)}</div>
<div class="lbl">su respuesta</div><div class="txt">${esc(p.reply)}</div>
${p.note?`<div class="note">* ${esc(p.note)} *</div>`:''}
${blk('borrador · EN','d-'+p.id,p.draft)}${p.draft_alt?blk('alternativa corta · EN','a-'+p.id,p.draft_alt):''}
<div style="margin-top:8px"><a href="${esc(p.post_url)}" target="_blank" rel="noopener">[abrir respuesta ↗]</a></div></article>`}).join('')||'<div class="sys" style="margin-top:22px">* sin respuestas por ahora *</div>';
document.querySelectorAll('.cp').forEach(b=>b.addEventListener('click',()=>copyDraft(b,document.getElementById(b.dataset.draftId).textContent)));
document.querySelectorAll('[data-o]').forEach(b=>{b.style.fontWeight=b.dataset.o===O?'700':'400'});}
(async()=>{const r=await fetch('./replies.json?ts='+Date.now());D=await r.json();
document.getElementById('meta').textContent='* actualizado: '+new Date(D.meta.updated_at).toLocaleString('es-CL',{timeZone:'America/Santiago'})+' (Chile) *';
document.getElementById('summary').textContent=`* ${D.replies.filter(p=>Date.now()-new Date(p.date)<=24*H).length} respuestas (últimas 24 h) · ${D.replies.filter(isNew).length} nuevas *`;
document.querySelectorAll('[data-o]').forEach(b=>b.addEventListener('click',()=>{O=b.dataset.o;render()}));render();})();
document.getElementById('theme-toggle').addEventListener('click',function(){const h=document.documentElement;const n=h.dataset.theme==='day';h.dataset.theme=n?'night':'day';this.textContent=n?'☾ noche':'☀ día'});
document.getElementById('refresh').addEventListener('click',()=>{const u=new URL(location.href);u.searchParams.set('r',Date.now());location.replace(u.toString())});
</script>
</body>
</html>
