<!DOCTYPE html>
<html lang="es" data-theme="night">
<head>
<meta http-equiv="Cache-Control" content="no-cache" />
<meta http-equiv="Pragma" content="no-cache" />
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#07090b" />
<meta name="color-scheme" content="dark light" />
<title>Likes sin comentar · @ForecastQuant</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
/* xvs-dash-2026 · Grok Bot X Virality Score board */
/* xvs-mobile-2026 · phone / tablet layout pass */
:root, html[data-theme="night"] {
  --bg:#07090b;
  --bg-elev:#0c1013;
  --panel:#0e1317;
  --panel-2:#12181d;
  --panel-glass:rgba(14,19,23,.88);
  --line:#1e272e;
  --line-strong:#2a353d;
  --text:#f4f7f8;
  --muted:#8a969d;
  --faint:#5c6970;
  --cyan:#2ad4f5;
  --cyan-2:#9eecff;
  --cyan-dim:rgba(42,212,245,.14);
  --lime:#c8f04a;
  --lime-dim:rgba(200,240,74,.12);
  --green:#3dff9b;
  --green-dim:rgba(61,255,155,.1);
  --red:#ff5a72;
  --amber:#ffc24a;
  --amber-dim:rgba(255,194,74,.1);
  --stat-bg:#0a0e11;
  --card:#0c1014;
  --track:#161c21;
  --ring-hole:#080a0c;
  --grid:rgba(42,212,245,.035);
  --glow:rgba(42,212,245,.09);
  --glow-2:rgba(200,240,74,.05);
  --shadow:0 18px 48px rgba(0,0,0,.45);
  --noise:rgba(255,255,255,.018);
  --scan:rgba(42,212,245,.03);
  --radius:14px;
  --radius-sm:10px;
  --ease:cubic-bezier(.22,.8,.24,1);
  --theme-dur:.42s;
}
html[data-theme="day"] {
  --bg:#f3f6f8;
  --bg-elev:#ffffff;
  --panel:#ffffff;
  --panel-2:#eef3f5;
  --panel-glass:rgba(255,255,255,.9);
  --line:#d4dee3;
  --line-strong:#b8c6cd;
  --text:#0a1215;
  --muted:#55656d;
  --faint:#7a8a92;
  --cyan:#048fad;
  --cyan-2:#036a82;
  --cyan-dim:rgba(4,143,173,.1);
  --lime:#4f8f00;
  --lime-dim:rgba(79,143,0,.1);
  --green:#0a8a4e;
  --green-dim:rgba(10,138,78,.1);
  --red:#c9223c;
  --amber:#a86a00;
  --amber-dim:rgba(168,106,0,.1);
  --stat-bg:#ffffff;
  --card:#ffffff;
  --track:#e3eaed;
  --ring-hole:#f7fafb;
  --grid:rgba(4,143,173,.055);
  --glow:rgba(4,143,173,.1);
  --glow-2:rgba(79,143,0,.06);
  --shadow:0 16px 40px rgba(10,18,21,.08);
  --noise:rgba(10,18,21,.02);
  --scan:rgba(4,143,173,.025);
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;overflow-x:hidden;max-width:100%}
body.xvs-dash-2026,body.xvs-mobile-2026{overflow-x:hidden;max-width:100%;-webkit-tap-highlight-color:transparent}
body.xvs-mobile-2026{
  padding-left:env(safe-area-inset-left,0px);
  padding-right:env(safe-area-inset-right,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
body.xvs-dash-2026{
  margin:0;min-height:100vh;color:var(--text);
  font-family:Inter,system-ui,sans-serif;
  background-color:var(--bg);
  background-image:
    radial-gradient(900px 420px at 12% -8%, var(--glow), transparent 55%),
    radial-gradient(700px 380px at 92% 8%, var(--glow-2), transparent 50%),
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size:auto, auto, 48px 48px, 48px 48px;
  background-position:0 0, 0 0, 0 0, 0 0;
  transition:background-color var(--theme-dur) var(--ease), color var(--theme-dur) var(--ease);
  animation:gridDrift 48s linear infinite;
  -webkit-font-smoothing:antialiased;
}
@keyframes gridDrift{
  0%{background-position:0 0,0 0,0 0,0 0}
  100%{background-position:0 0,0 0,48px 48px,48px 48px}
}
body.xvs-dash-2026::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    repeating-linear-gradient(0deg, transparent, transparent 2px, var(--scan) 3px),
    radial-gradient(circle at 50% 0%, var(--noise), transparent 60%);
  opacity:.55;mix-blend-mode:soft-light;
}
body.xvs-dash-2026::after{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.4;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.45'/%3E%3C/svg%3E");
  background-size:180px 180px;mix-blend-mode:overlay;
}
a{color:inherit}
.wrap{width:min(1160px,calc(100% - 40px));margin:auto;padding:28px 0 80px;position:relative;z-index:1}

/* Header */
.site-header{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:8px 0 26px;border-bottom:1px solid var(--line)}
.brand-lockup{display:flex;align-items:center;gap:16px;min-width:0}
.x-logo{
  width:48px;height:48px;display:grid;place-items:center;flex:none;
  border:1px solid var(--line-strong);background:#000;color:#fff;
  border-radius:12px;box-shadow:0 0 0 1px rgba(255,255,255,.04),0 0 32px rgba(255,255,255,.06);
  transition:transform .35s var(--ease), box-shadow .35s var(--ease);
}
.x-logo:hover{transform:translateY(-1px) scale(1.02)}
html[data-theme="day"] .x-logo{background:#111;box-shadow:0 8px 20px rgba(0,0,0,.12)}
.x-logo svg{width:22px;height:22px}
.eyebrow{font:600 10px/1 "IBM Plex Mono",monospace;text-transform:uppercase;letter-spacing:.2em;color:var(--cyan)}
h1{margin:6px 0 0;font-size:clamp(20px,3vw,30px);line-height:1.05;letter-spacing:-.045em;font-weight:800}
.handle{color:var(--muted);font-weight:600}
.powered{margin-top:7px;font:500 10px/1 "IBM Plex Mono",monospace;color:var(--faint);letter-spacing:.04em}
.header-meta{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.header-actions{display:flex;align-items:center;gap:10px}
.theme-toggle{
  border:1px solid var(--line);background:var(--panel-glass);backdrop-filter:blur(10px);
  color:var(--text);padding:9px 14px;font:600 10px "IBM Plex Mono",monospace;
  letter-spacing:.1em;text-transform:uppercase;cursor:pointer;border-radius:999px;
  display:inline-flex;align-items:center;gap:8px;
  transition:border-color .25s, color .25s, background .25s, transform .25s var(--ease);
}
.theme-toggle:hover{border-color:var(--cyan);color:var(--cyan);transform:translateY(-1px)}
.theme-toggle .ico{width:14px;height:14px;display:grid;place-items:center}
.live{display:inline-flex;align-items:center;gap:8px;font:600 11px "IBM Plex Mono",monospace;text-transform:uppercase;letter-spacing:.1em;color:var(--green)}
.live-dot{width:8px;height:8px;background:var(--green);border-radius:50%;box-shadow:0 0 12px var(--green);position:relative}
.live-dot::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:1px solid var(--green);opacity:.7;animation:livePulse 1.6s ease-out infinite}
@keyframes livePulse{0%{transform:scale(.6);opacity:.8}70%{transform:scale(1.9);opacity:0}100%{transform:scale(1.9);opacity:0}}
#meta{margin-top:2px;color:var(--muted);font:500 11px "IBM Plex Mono",monospace}

/* Panels & reveal */
.hero{display:grid;grid-template-columns:1.05fr .95fr;gap:14px;margin:22px 0 14px}
.panel{
  position:relative;background:var(--panel-glass);border:1px solid var(--line);
  border-radius:var(--radius);overflow:hidden;backdrop-filter:blur(12px);
  box-shadow:var(--shadow);
  transition:background var(--theme-dur), border-color var(--theme-dur), transform .35s var(--ease), box-shadow .35s var(--ease);
}
.panel::after{
  content:"";position:absolute;right:-18px;top:-18px;width:78px;height:78px;
  border:1px solid var(--cyan-dim);transform:rotate(45deg);border-radius:4px;pointer-events:none;
}
.panel:hover{border-color:var(--line-strong)}
.reveal{opacity:0;transform:translateY(14px);animation:riseIn .7s var(--ease) forwards}
.reveal:nth-child(1){animation-delay:.04s}
.reveal:nth-child(2){animation-delay:.1s}
.reveal:nth-child(3){animation-delay:.16s}
.reveal:nth-child(4){animation-delay:.22s}
.reveal:nth-child(5){animation-delay:.28s}
@keyframes riseIn{to{opacity:1;transform:none}}

.score-panel{min-height:300px;padding:28px 30px;display:grid;grid-template-columns:1fr auto;align-items:center;gap:18px}
.panel-label{font:600 11px "IBM Plex Mono",monospace;text-transform:uppercase;letter-spacing:.16em;color:var(--muted)}
.panel-label strong{color:var(--cyan)}
.score-title-row{display:flex;align-items:center;gap:12px;margin:14px 0 12px}
.score-title-row .x-mark{
  width:28px;height:28px;display:grid;place-items:center;background:#000;border:1px solid #333;
  border-radius:8px;color:#fff;flex:none;
}
.score-title-row .x-mark svg{width:14px;height:14px}
.score-copy h2{font-size:clamp(34px,5vw,62px);line-height:.95;margin:0;letter-spacing:-.07em}
.score-copy p{max-width:340px;margin:0;color:var(--muted);font-size:13px;line-height:1.55}
.score-ring{
  --score:0;position:relative;width:176px;height:176px;border-radius:50%;display:grid;place-items:center;
  background:conic-gradient(var(--cyan) calc(var(--score)*1%), var(--track) 0);
  box-shadow:0 0 0 1px var(--cyan-dim), 0 0 48px rgba(42,212,245,.16);
  transition:box-shadow .4s;
}
.score-ring::before{content:"";position:absolute;inset:11px;border-radius:50%;background:var(--ring-hole);border:1px solid var(--line)}
.score-ring::after{
  content:"";position:absolute;inset:-6px;border-radius:50%;border:1px dashed var(--cyan-dim);
  animation:ringSpin 28s linear infinite;pointer-events:none;
}
@keyframes ringSpin{to{transform:rotate(360deg)}}
.score-inner{position:relative;text-align:center;z-index:1}
.score-number{font:800 68px/.9 Inter,sans-serif;letter-spacing:-.08em;font-variant-numeric:tabular-nums}
.score-of{font:600 10px "IBM Plex Mono",monospace;color:var(--muted);letter-spacing:.18em;margin-top:8px}
.trend{margin-top:11px;display:inline-flex;align-items:center;gap:6px;font:600 11px "IBM Plex Mono",monospace}
.trend.up{color:var(--green)}.trend.down{color:var(--red)}.trend.flat{color:var(--muted)}
.trend-arrow{font-size:16px}

.target-panel{min-height:300px;padding:28px;display:flex;flex-direction:column}
.target-head{display:flex;justify-content:space-between;align-items:start;gap:16px}
.target-title{font-size:28px;font-weight:800;letter-spacing:-.05em;margin-top:10px}
.target-state{
  border:1px solid currentColor;padding:7px 11px;font:700 10px "IBM Plex Mono",monospace;
  letter-spacing:.08em;border-radius:999px;
}
.target-state.done{color:var(--green);background:var(--green-dim)}
.target-state.pending{color:var(--amber);background:var(--amber-dim)}
.target-list{display:grid;gap:20px;margin-top:auto;padding-top:24px}
.target-row-head{display:flex;justify-content:space-between;align-items:end;font-size:13px;color:var(--muted)}
.target-row-head b{font:700 18px "IBM Plex Mono",monospace;color:var(--text)}
.target-track{height:9px;margin-top:9px;background:var(--track);border:1px solid var(--line);overflow:hidden;border-radius:999px}
.target-fill{
  height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--cyan-2));
  box-shadow:0 0 16px rgba(42,212,245,.35);transition:width 1.15s var(--ease);border-radius:inherit;
}
.target-fill.done{background:linear-gradient(90deg,var(--green),var(--lime));box-shadow:0 0 16px rgba(61,255,155,.3)}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:14px 0}
.stat{
  min-height:128px;background:var(--stat-bg);border:1px solid var(--line);padding:18px 18px 16px;
  position:relative;overflow:hidden;border-radius:var(--radius-sm);
  transition:transform .3s var(--ease), border-color .3s, box-shadow .3s;
}
.stat:hover{transform:translateY(-2px);border-color:var(--line-strong);box-shadow:var(--shadow)}
.stat::before{content:"";position:absolute;left:0;top:0;width:42px;height:2px;background:var(--cyan);border-radius:0 0 2px 0}
.stat:nth-child(2)::before,.stat:nth-child(5)::before{background:var(--lime)}
.stat-k{font:600 10px "IBM Plex Mono",monospace;color:var(--muted);text-transform:uppercase;letter-spacing:.13em}
.stat-v{margin-top:12px;font-size:clamp(26px,3vw,40px);font-weight:800;letter-spacing:-.06em;color:var(--text);white-space:nowrap;font-variant-numeric:tabular-nums}
.stat:nth-child(2) .stat-v,.stat:nth-child(5) .stat-v{color:var(--lime)}
.stat:nth-child(3) .stat-v{color:var(--cyan)}
.stat-note{margin-top:8px;font:500 10px "IBM Plex Mono",monospace;color:var(--muted)}
.up{color:var(--green)!important}.down{color:var(--red)!important}.flat{color:var(--muted)!important}

/* Charts */
.charts-row{display:grid;grid-template-columns:1.05fr .95fr;gap:12px;margin-bottom:18px}
.chart-panel{padding:22px 24px}
.chart-head{display:flex;align-items:end;justify-content:space-between;gap:14px;margin-bottom:16px}
.chart-head h2{margin:8px 0 0;font-size:22px;letter-spacing:-.04em}
.chart-scale{font:500 10px "IBM Plex Mono",monospace;color:var(--muted)}
#sparkline,#day-compare{height:130px;width:100%;display:block}
.spark-labels,.compare-labels{display:flex;justify-content:space-around;margin-top:8px;color:var(--muted);font:500 9px "IBM Plex Mono",monospace;overflow:hidden;gap:4px}
.spark-labels span,.compare-labels span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:9%}

/* Sections */
.section-head{margin:36px 0 14px;padding-bottom:12px;border-bottom:1px solid var(--line);display:flex;align-items:end;justify-content:space-between;gap:15px}
.section-head h2{margin:0;font-size:21px;letter-spacing:-.04em}
.section-index{color:var(--cyan);font:600 10px "IBM Plex Mono",monospace;letter-spacing:.14em;text-transform:uppercase}
.section-note{color:var(--muted);font:500 10px "IBM Plex Mono",monospace;text-align:right}

.hits-col{display:flex;flex-direction:column;gap:12px}
.card{
  background:var(--card);border:1px solid var(--line);padding:22px;position:relative;border-radius:var(--radius-sm);
  transition:border-color .28s, transform .28s var(--ease), box-shadow .28s;
}
.card:hover{border-color:var(--cyan);transform:translateY(-2px);box-shadow:0 12px 32px rgba(0,0,0,.18)}
.card.pending{opacity:.72;border-style:dashed}
.card-top{display:flex;justify-content:space-between;gap:18px;align-items:flex-start}
.identity{display:flex;gap:12px;align-items:center}
.rank{
  width:34px;height:34px;display:grid;place-items:center;background:var(--panel-2);
  border:1px solid var(--line);color:var(--cyan);font:600 11px "IBM Plex Mono",monospace;border-radius:8px;
}
.name{font-weight:750;letter-spacing:-.02em}
.card .handle{font:500 11px "IBM Plex Mono",monospace;margin-top:4px}
.views-big{text-align:right;color:var(--lime);font:700 18px "IBM Plex Mono",monospace;white-space:nowrap}
.views-big small{display:block;color:var(--muted);font-size:9px;text-transform:uppercase;letter-spacing:.12em;margin-top:5px}
.hit-target{margin:16px 0 0;display:flex;align-items:center;gap:9px;flex-wrap:wrap;font:600 10px "IBM Plex Mono",monospace;text-transform:uppercase;letter-spacing:.05em}
.hit-target .mark{display:grid;place-items:center;width:20px;height:20px;border-radius:50%;font-weight:800}
.hit-target.done{color:var(--green)}
.hit-target.done .mark{background:var(--green);color:#001b0c}
.hit-target.not-done{color:var(--amber)}
.hit-target.not-done .mark{border:1px solid var(--amber);color:var(--amber)}
.hook{color:var(--muted);font-size:14px;line-height:1.6;margin-top:15px;opacity:.95}
html[data-theme="night"] .hook{color:#c4ced1}
.chip{
  display:inline-flex;align-items:center;gap:7px;margin-top:12px;padding:7px 11px;
  border:1px solid rgba(42,212,245,.35);background:var(--cyan-dim);color:var(--cyan-2);
  font:500 10px/1.4 "IBM Plex Mono",monospace;border-radius:999px;
}
html[data-theme="day"] .chip{border-color:#9ad3e0;background:#e8f7fb;color:var(--cyan-2)}
.chip::before{content:"▶";font-size:8px}
.draft-block{margin-top:15px;background:var(--panel-2);border:1px solid var(--line);padding:14px;border-radius:10px}
.draft-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.draft-label{font:600 9px "IBM Plex Mono",monospace;color:var(--muted);text-transform:uppercase;letter-spacing:.15em}
.copy-btn{
  border:1px solid var(--cyan);background:transparent;color:var(--cyan);padding:6px 11px;
  font:600 9px "IBM Plex Mono",monospace;cursor:pointer;border-radius:999px;
  transition:background .2s, color .2s, transform .2s;
}
.copy-btn:hover,.copy-btn.copied{background:var(--cyan);color:#001014;transform:translateY(-1px)}
.draft-text{white-space:pre-wrap;word-break:break-word;max-height:220px;overflow:auto;color:var(--muted);font:400 11px/1.58 "IBM Plex Mono",monospace;margin:12px 0 0}
.post-link{display:inline-block;margin-top:14px;color:var(--text);font:600 10px "IBM Plex Mono",monospace;text-decoration:none;border-bottom:1px solid var(--cyan);padding-bottom:3px}
.post-link.disabled{color:var(--muted);border-color:var(--muted);pointer-events:none}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tag{border:1px solid var(--line);background:var(--panel-2);padding:9px 12px;color:var(--muted);font-size:11px;border-radius:999px;transition:border-color .2s, color .2s}
.tag:hover{border-color:var(--cyan);color:var(--cyan)}
.tag::before{content:"# ";color:var(--cyan)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}
.grid .card{min-height:200px}
.narrative{margin-top:11px;padding:20px;border-left:3px solid var(--lime);background:var(--panel-2);color:var(--muted);font-size:13px;line-height:1.65;border-radius:0 var(--radius-sm) var(--radius-sm) 0}
.muted{color:var(--muted);font-size:13px}
.boards{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:8px}
.board-panel{padding:20px 22px}
.board-panel h3{margin:8px 0 14px;font-size:18px;letter-spacing:-.03em}
.lb-row{display:grid;grid-template-columns:36px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.lb-row:first-of-type{border-top:0}
.lb-handle{font:700 13px "IBM Plex Mono",monospace;color:var(--cyan)}
.lb-meta{font:500 10px "IBM Plex Mono",monospace;color:var(--muted);margin-top:3px}
.lb-views{font:700 13px "IBM Plex Mono",monospace;color:var(--lime);text-align:right;white-space:nowrap}
.lb-views small{display:block;color:var(--muted);font-size:9px;margin-top:3px;font-weight:500}
.nohits-block{display:grid;gap:10px}
.nohit{
  display:grid;grid-template-columns:minmax(140px,180px) 1fr auto;gap:14px;align-items:start;
  background:var(--card);border:1px solid var(--line);padding:16px 18px;position:relative;overflow:hidden;border-radius:var(--radius-sm);
}
.nohit::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--amber)}
.nohit-handle{font:800 16px/1.2 "IBM Plex Mono",monospace;color:var(--amber);letter-spacing:-.02em}
.nohit-badge{margin-top:8px;display:inline-flex;padding:4px 8px;border:1px solid var(--amber);color:var(--amber);font:700 9px "IBM Plex Mono",monospace;letter-spacing:.08em;text-transform:uppercase;border-radius:999px}
.nohit-reason{color:var(--muted);font-size:13px;line-height:1.55}
.nohit-max{font:600 11px "IBM Plex Mono",monospace;color:var(--muted);text-align:right;white-space:nowrap}
.nohit-max b{display:block;color:var(--text);font-size:16px;margin-top:4px}
footer{margin-top:52px;padding-top:22px;border-top:1px solid var(--line);color:var(--muted)}
.privacy{background:var(--stat-bg);border:1px solid var(--line);padding:22px 24px;margin-bottom:16px;border-radius:var(--radius)}
.privacy h3{margin:0 0 12px;font:700 12px "IBM Plex Mono",monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--cyan)}
.privacy ul{margin:0;padding:0;list-style:none;display:grid;gap:9px}
.privacy li{font:500 11px/1.55 "IBM Plex Mono",monospace;color:var(--muted);padding-left:14px;position:relative}
.privacy li::before{content:"";position:absolute;left:0;top:7px;width:6px;height:6px;background:var(--lime);border-radius:1px}
.footer-row{display:flex;justify-content:space-between;gap:20px;font:500 10px/1.6 "IBM Plex Mono",monospace}
.footer-mark{color:var(--cyan)}

/* Ambient bot */
.grok-ambient{position:fixed;right:18px;bottom:18px;width:64px;height:64px;z-index:20;pointer-events:none;opacity:.92;filter:drop-shadow(0 0 14px rgba(42,212,245,.4));animation:floatBot 4.5s ease-in-out infinite}
.grok-ambient svg{width:100%;height:100%;display:block}
.grok-ambient .eye{animation:blink 5.2s infinite}
.grok-ambient .antenna{transform-origin:32px 10px;animation:wiggle 3.2s ease-in-out infinite}
@keyframes floatBot{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes blink{0%,92%,100%{opacity:1}94%,96%{opacity:.15}}
@keyframes wiggle{0%,100%{transform:rotate(0)}50%{transform:rotate(8deg)}}
.grok-trail{position:fixed;right:42px;bottom:78px;width:6px;height:6px;border-radius:50%;background:var(--cyan);opacity:.35;z-index:19;pointer-events:none;animation:trail 4.5s ease-in-out infinite}
@keyframes trail{0%,100%{transform:translateY(0);opacity:.15}50%{transform:translateY(-18px);opacity:.45}}

.lb-row.you,.roster-row.you{
  border:1px solid rgba(200,240,74,.5);background:var(--lime-dim);
  box-shadow:inset 3px 0 0 var(--lime);padding-left:10px;margin:4px 0;border-radius:8px;
}
.you-chip{display:inline-flex;align-items:center;margin-left:8px;padding:2px 7px;border:1px solid var(--lime);color:var(--lime);font:800 9px "IBM Plex Mono",monospace;letter-spacing:.1em;vertical-align:middle;border-radius:999px}
.your-day{margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.your-day .yd-label{font:600 10px "IBM Plex Mono",monospace;text-transform:uppercase;letter-spacing:.14em;color:var(--lime);margin-bottom:10px}
.your-day .yd-meta{font:500 11px "IBM Plex Mono",monospace;color:var(--muted);margin-bottom:12px}
.your-day .yd-meta a{color:var(--cyan);text-decoration:none;border-bottom:1px solid rgba(42,212,245,.35)}
.roster-panel{padding:20px 22px;margin-bottom:8px}
.roster-list{display:grid;gap:0}
.roster-row{display:grid;grid-template-columns:36px 1fr auto auto;gap:12px;align-items:center;padding:9px 8px;border-top:1px solid var(--line);border-radius:6px;transition:background .2s}
.roster-row:first-child{border-top:0}
.roster-row:hover{background:var(--panel-2)}
.roster-handle{font:700 13px "IBM Plex Mono",monospace;color:var(--cyan)}
.roster-name{font:500 10px "IBM Plex Mono",monospace;color:var(--muted);margin-top:2px}
.roster-views{font:700 12px "IBM Plex Mono",monospace;color:var(--lime);text-align:right;white-space:nowrap}
.roster-badge{font:700 9px "IBM Plex Mono",monospace;letter-spacing:.08em;text-transform:uppercase;text-align:right;min-width:52px}
.roster-badge.hit{color:var(--green)}.roster-badge.miss{color:var(--amber)}

.week-strip{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.week-day{
  flex:1;min-width:52px;padding:8px 6px;text-align:center;border:1px solid var(--line);
  background:var(--panel-2);border-radius:8px;font:600 9px "IBM Plex Mono",monospace;color:var(--muted);
  transition:border-color .25s, color .25s, background .25s;
}
.week-day.on{border-color:var(--cyan);color:var(--cyan);background:var(--cyan-dim)}
.week-day .wd-d{display:block;font-size:11px;color:var(--text);margin-top:3px;letter-spacing:0}

@media(max-width:980px){
  .hero,.charts-row{grid-template-columns:1fr}
  .stats{grid-template-columns:repeat(3,1fr)}
  .score-panel,.target-panel{min-height:0}
  .grid,.boards{grid-template-columns:1fr}
  .nohit{grid-template-columns:1fr}
  .nohit-max{text-align:left}
}
/* —— xvs-mobile-2026 —— */

  .stats{grid-template-columns:repeat(2,1fr);gap:8px}

  .stat-note{font-size:9px}
  .chart-panel{padding:16px 12px;overflow:hidden}
  .chart-head{flex-wrap:wrap;align-items:flex-start;gap:8px}
  .chart-head h2{font-size:18px}
  #sparkline,#day-compare{height:110px;max-width:100%}
  .spark-labels,.compare-labels{
    justify-content:space-between;gap:2px;overflow:hidden;width:100%;
  }
  .spark-labels span,.compare-labels span{
    max-width:none;flex:1 1 0;min-width:0;font-size:8px;text-align:center;
  }
  .week-strip{gap:5px}
  .week-day{min-width:calc(25% - 5px);flex:1 1 calc(25% - 5px);padding:10px 4px}
  .section-head{flex-wrap:wrap;align-items:flex-start;gap:8px;margin:28px 0 12px}
  .section-head h2{font-size:18px}
  .section-note{text-align:left;max-width:100%;font-size:9px}
  .roster-panel,.board-panel{padding:14px 12px;overflow:hidden}
  .roster-row{
    grid-template-columns:28px minmax(0,1fr) auto;gap:8px;padding:10px 4px;align-items:start;
  }
  .roster-row .roster-badge{grid-column:3;grid-row:1}
  .roster-views{
    grid-column:2 / -1;grid-row:2;text-align:left;font-size:11px;
    white-space:normal;word-break:break-word;padding-left:0;
  }
  .roster-handle,.lb-handle{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
  .roster-name,.lb-meta{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
  .boards,.grid{grid-template-columns:1fr}
  .lb-row{grid-template-columns:28px minmax(0,1fr);gap:8px;align-items:start}
  .lb-views{
    grid-column:2;text-align:left;font-size:12px;white-space:normal;word-break:break-word;margin-top:2px;
  }
  .card{padding:16px 14px;width:100%;max-width:100%}
  .card-top{flex-direction:column;gap:10px;align-items:stretch}
  .views-big{text-align:left;font-size:16px;white-space:normal;word-break:break-word}
  .identity{min-width:0}
  .name{overflow:hidden;text-overflow:ellipsis}
  .draft-block{padding:12px;max-width:100%}
  .draft-head{flex-wrap:wrap;gap:8px}
  .copy-btn{
    min-height:44px;min-width:72px;padding:10px 16px;font-size:11px;
    touch-action:manipulation;
  }
  .draft-text{max-height:180px;-webkit-overflow-scrolling:touch;font-size:10px}
  .nohit{grid-template-columns:1fr;gap:10px}
  .nohit-max{text-align:left}
  .tags{gap:6px}
  .tag{padding:10px 12px;font-size:11px}
  .footer-row{flex-direction:column;gap:8px}
  .privacy{padding:16px}
  .grok-ambient,.grok-trail{display:none}
  .panel::after{display:none}
}
@media(max-width:430px){
  .wrap{width:min(100% - 16px,1160px)}
  .stats{grid-template-columns:repeat(2,1fr)}
  .stat:nth-child(5){grid-column:1 / -1}
  .score-ring{width:124px;height:124px}
  .score-number{font-size:44px}
  .target-row-head b{font-size:12px}
  .week-day{min-width:calc(33.33% - 5px);flex:1 1 calc(33.33% - 5px)}
  .eyebrow{letter-spacing:.12em;font-size:9px}
  .powered{font-size:9px}
}
@media(min-width:431px) and (max-width:620px){
  .score-panel{grid-template-columns:1fr auto;justify-items:stretch;text-align:left}
  .score-copy{text-align:left}
  .score-title-row{justify-content:flex-start}
  .score-ring{margin:0}
}
@media(hover:none){
  .stat:hover,.card:hover,.panel:hover,.theme-toggle:hover,.x-logo:hover,.tag:hover{transform:none}
  .card:hover{box-shadow:none}
  .roster-row:hover{background:transparent}
  .roster-row.you:hover{background:var(--lime-dim)}
}

@media (prefers-reduced-motion: reduce){
  body.xvs-dash-2026{animation:none!important}
  .live-dot::after,.grok-ambient,.grok-ambient .eye,.grok-ambient .antenna,.grok-trail,
  .score-ring::after,.target-fill,.reveal,.stat,.card,.theme-toggle,.x-logo{animation:none!important;transition:none!important}
  .reveal{opacity:1;transform:none}
}
</style>
<style>.xvs-refresh-bar{display:flex;justify-content:flex-end;align-items:center;gap:10px;padding:10px 0 0}.xvs-refresh-btn{font:600 11px "IBM Plex Mono",monospace;letter-spacing:.12em;text-transform:uppercase;color:#0b0d0e;background:linear-gradient(135deg,#2ad4f5,#c8f04a);border:0;border-radius:999px;padding:10px 18px;cursor:pointer}.xvs-refresh-btn:disabled{opacity:.6;cursor:wait}.xvs-refresh-note{font:400 10px "IBM Plex Mono",monospace;color:var(--muted)}</style>
</head>
<body class="xvs-dash-2026 xvs-mobile-2026">
<div class="grok-trail" aria-hidden="true"></div>
<div class="grok-ambient" aria-hidden="true" title="Grok Bot (decorative)">
  <svg viewBox="0 0 64 64" role="img">
    <defs>
      <linearGradient id="gb" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#2ad4f5"/>
        <stop offset="100%" stop-color="#c8f04a"/>
      </linearGradient>
    </defs>
    <rect x="10" y="16" width="44" height="36" rx="12" fill="#0b0d0e" stroke="url(#gb)" stroke-width="2"/>
    <circle class="antenna" cx="32" cy="10" r="3.2" fill="#2ad4f5"/>
    <path class="antenna" d="M32 13 V18" stroke="#2ad4f5" stroke-width="2"/>
    <circle class="eye" cx="24" cy="32" r="4" fill="#2ad4f5"/>
    <circle class="eye" cx="40" cy="32" r="4" fill="#2ad4f5"/>
    <path d="M24 42 Q32 48 40 42" fill="none" stroke="#c8f04a" stroke-width="2" stroke-linecap="round"/>
    <rect x="18" y="52" width="8" height="6" rx="2" fill="#2ad4f5" opacity=".7"/>
    <rect x="38" y="52" width="8" height="6" rx="2" fill="#2ad4f5" opacity=".7"/>
  </svg>
</div>
<div class="wrap">
<div class="xvs-refresh-bar"><a class="xvs-refresh-note" href="./index.html">← Volver al board principal</a><span class="xvs-refresh-note" id="xvs-refresh-note"></span><button type="button" class="xvs-refresh-btn" id="xvs-refresh-btn">↻ Actualizar</button></div>
  <header class="site-header reveal">
    <div class="brand-lockup">
      <div class="x-logo" aria-label="X"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24h-6.657l-5.214-6.817-5.967 6.817H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231 5.45-6.231Zm-1.161 17.52h1.833L7.084 4.126H5.117L17.083 19.77Z"/></svg></div>
      <div><div class="eyebrow">likes sin comentar</div><h1>Respuestas sugeridas <span class="handle">· @ForecastQuant</span></h1><div class="powered">respuestas en inglés · solo lectura, nada se publica en X</div></div>
    </div>
    <div class="header-meta"><div class="header-actions"><button type="button" class="theme-toggle" id="theme-toggle"><span class="ico" id="theme-ico">☾</span><span id="theme-label">Night</span></button></div><div id="meta">cargando datos…</div></div>
  </header>
  <main>
    <div class="section-head reveal"><div><div class="section-index">01 / resumen</div><h2>Likes sin comentar</h2><div class="section-note">Posts de las últimas 24 horas que aún no has respondido</div></div><div class="section-note" id="summary"></div></div>
    <div class="xvs-refresh-bar" style="justify-content:flex-start"><button type="button" class="copy-btn" data-f="niche">En tu nicho</button><button type="button" class="copy-btn" data-f="all">Todos</button><button type="button" class="copy-btn" data-f="skip">No recomendado</button></div>
    <section class="grid" id="likes"></section>
    <p class="muted" id="limits" style="margin-top:24px"></p>
  </main>
</div>
<script>
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function fmt(n){n=Number(n)||0;return n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e3?(n/1e3).toFixed(1)+'K':String(n)}
async function copyDraft(btn,text){try{await navigator.clipboard.writeText(text)}catch(e){const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove()}const p=btn.textContent;btn.textContent='COPIED';btn.classList.add('copied');setTimeout(()=>{btn.textContent=p;btn.classList.remove('copied')},1400)}
let D,F='niche';
function render(){const cut=Date.now()-864e5;const ps=D.posts.filter(p=>Date.parse(p.created_at)>=cut).slice().sort((a,b)=>Date.parse(b.created_at)-Date.parse(a.created_at)).filter(p=>F==='all'||(F==='niche'?p.in_niche:!p.in_niche));
document.getElementById('likes').innerHTML=ps.map((p,i)=>{const m=p.m||{};const d=new Date(p.created_at).toLocaleString('es-CL',{timeZone:'America/Santiago',dateStyle:'medium',timeStyle:'short'});
const rep=p.in_niche?`<div class="draft-block"><div class="draft-head"><span class="draft-label">Reply · EN</span><button type="button" class="copy-btn cp" data-draft-id="r-${p.id}">COPY DRAFT</button></div><pre class="draft-text" id="r-${p.id}">${esc(p.reply_en)}</pre></div>`:`<div class="chip">No recomendado responder: ${esc(p.skip_reason)}</div>`;
return`<article class="card"><div class="card-top"><div class="identity"><div class="rank">${String(i+1).padStart(2,'0')}</div><div><div class="name">${esc(p.author)}</div><div class="handle">@${esc(p.username)} · ${esc(d)}</div></div></div><div class="views-big">${fmt(m.impression_count)}<small>views</small></div></div><div class="handle">♥ ${fmt(m.like_count)} · ↻ ${fmt(m.repost_count)} · 💬 ${fmt(m.reply_count)}</div><div class="hook">${esc(p.text)}</div>${rep}<a class="post-link" href="${esc(p.url)}" target="_blank" rel="noopener">ABRIR POST ↗</a></article>`}).join('')||'<p class="muted">Nada en este filtro.</p>';if(!ps.length)document.getElementById('likes').innerHTML='<div class="section-note" style="text-align:left;padding:24px 0">No hay posts nuevos por ahora. Se actualiza a las 07:00, 11:00, 16:00 y 20:00 (hora de Chile).</div>';
document.querySelectorAll('.cp').forEach(b=>b.addEventListener('click',()=>copyDraft(b,document.getElementById(b.dataset.draftId).textContent)));
document.querySelectorAll('[data-f]').forEach(b=>b.classList.toggle('copied',b.dataset.f===F));}
(async()=>{const r=await fetch('./likes.json?ts='+Date.now());D=await r.json();const M=D.meta;
document.getElementById('meta').textContent='Actualizado: '+new Date(M.generated_at).toLocaleString('es-CL',{timeZone:'America/Santiago'})+' (Chile)';
{const cut=Date.now()-864e5;const v=D.posts.filter(p=>Date.parse(p.created_at)>=cut);const n=v.filter(p=>p.in_niche).length;document.getElementById('summary').textContent=`${v.length} pendientes (${n} en tu nicho, ${v.length-n} no recomendado) · Última actualización: ${new Date(M.generated_at).toLocaleString('es-CL',{timeZone:'America/Santiago'})} (Chile)`;}
document.getElementById('limits').textContent=`Solo se muestran posts creados en las últimas 24 horas (según tu hora actual); se revisaron tus últimos ${M.likes_scanned} likes. "Comentado" = tienes una respuesta o quote en la conversación del post. Las respuestas son sugerencias de opinión, no consejo financiero; revisa antes de publicar.`;
document.querySelectorAll('[data-f]').forEach(b=>b.addEventListener('click',()=>{F=b.dataset.f;render()}));render();})();
document.getElementById('theme-toggle').addEventListener('click',()=>{const h=document.documentElement;h.dataset.theme=h.dataset.theme==='night'?'day':'night'});
document.getElementById('xvs-refresh-btn').addEventListener('click',function(){this.disabled=true;this.textContent='Actualizando…';const u=new URL(location.href);u.searchParams.set('r',Date.now());location.replace(u.toString())});
document.getElementById('xvs-refresh-note').textContent='Muestra los últimos datos publicados';
</script>
</body></html>
