<!doctype html>
<html lang="es" data-theme="night">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#000000" />
<title>likes/@ForecastQuant</title>
<style>
:root,html[data-theme="day"]{--bg:#fff;--fg:#1B7F1B;--fg2:#4C9A4C;--acc:#3366CC;--line:#d6d6d6;--hover:#f3f8f3}
html[data-theme="night"]{--bg:#000;--fg:#33FF66;--fg2:#22AA44;--acc:#5C9DFF;--line:#1f3a1f;--hover:#061a06}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font:15px/1.55 ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono","Courier New",monospace;-webkit-text-size-adjust:100%}
a{color:var(--acc);text-decoration:none}a:hover{text-decoration:underline}
button{font:inherit;background:none;border:0;padding:0;cursor:pointer;color:var(--acc)}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px}
.title{font-size:22px;font-weight:500;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.title .u{color:var(--fg)}
.tools{display:flex;align-items:center;gap:16px;flex-shrink:0}
.ico{width:18px;height:18px;stroke:var(--fg2);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}
.tools button{display:inline-flex;align-items:center;gap:5px;color:var(--fg2)}
.tag{color:var(--acc)}
main{max-width:860px;margin:0 auto;padding:14px 18px 60px}
.sys{color:var(--fg2);margin:6px 0}
.sys.strong{color:var(--fg)}
.nav{display:flex;flex-wrap:wrap;gap:6px 18px;margin:14px 0 8px}
.nav button,.nav a{color:var(--acc)}
.nav button.on{color:var(--fg);text-decoration:underline;text-underline-offset:4px}
.post{border-top:1px solid var(--line);padding:14px 0}
.meta{color:var(--fg2);font-size:13px}
.who{color:var(--fg)}.who .h{color:var(--acc)}
.text{white-space:pre-wrap;word-wrap:break-word;margin:8px 0;color:var(--fg)}
.reply{margin:8px 0;padding-left:12px;border-left:2px solid var(--fg2)}
.reply .lbl,.skip .lbl{color:var(--acc);font-size:13px}
.reply pre{margin:4px 0;white-space:pre-wrap;font:inherit;color:var(--fg)}
.skip{color:var(--fg2);margin:8px 0}
.mo{font-size:12px;color:var(--fg2)}.mo b{font-weight:500;color:var(--acc)}.mo.alto b{color:var(--fg)}
.vis{font-size:12px;color:var(--fg2);margin:4px 0}
.post.nr .text{color:var(--fg2)}
.acts{display:flex;gap:18px;font-size:13px}
.acts a{color:var(--acc)}
.acts a.xb{color:var(--fg);font-weight:bold;border:1px solid var(--fg);padding:1px 8px}
.xbw{display:inline-flex;flex-direction:column;gap:2px}.xn{font-size:11px;color:var(--fg2)}
@media(max-width:560px){body{font-size:14px}.title{font-size:18px}.bar{padding:12px}main{padding:10px 12px 48px}.tools{gap:12px}.hide-sm{display:none}}
</style>
</head>
<body>
<header class="bar">
  <div class="title">likes/<span class="u">@ForecastQuant</span></div>
  <div class="tools">
    <button type="button" id="xvs-refresh-btn" title="Actualizar"><svg class="ico" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg><span class="hide-sm">actualizar</span></button>
    <span class="tag">#likes</span>
    <button type="button" id="theme-toggle" title="Tema"><svg class="ico" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><span id="theme-label">night</span></button>
  </div>
</header>
<main>
  <p class="sys">* Posts de las últimas 24 horas que aún no has respondido *</p>
  <p class="sys" id="meta">* cargando datos… *</p>
  <p class="sys" id="summary"></p>
  <nav class="nav"><button type="button" data-f="niche">#en_tu_nicho</button><button type="button" data-f="all">#todos</button><button type="button" data-f="skip">#no_recomendado</button><a href="./index.html">← board principal</a></nav>
  <section id="likes"></section>
  <p class="sys" id="limits" style="margin-top:24px"></p>
  <span id="xvs-refresh-note" hidden></span>
</main>
<script>
function pid(p){const m=/\/status\/(\d+)/.exec(p.url||'');return m?m[1]:String(p.id)}
function xIntent(p){return 'https://x.com/intent/post?text='+encodeURIComponent(p.reply_en)+'&in_reply_to='+pid(p)}
function xdeep(h){var u=new URL(h);var t=u.searchParams.get("text")||"";var d="twitter://post?message="+encodeURIComponent(t);var r=u.searchParams.get("in_reply_to");if(r)d+="&in_reply_to_status_id="+r;return d}
document.addEventListener("click",function(e){var a=e.target.closest&&e.target.closest("a.xb");if(!a)return;var ios=/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform=="MacIntel"&&navigator.maxTouchPoints>1);if(!ios)return;e.preventDefault();var w=a.href,tm;function cl(){if(document.hidden){clearTimeout(tm);document.removeEventListener("visibilitychange",cl)}}document.addEventListener("visibilitychange",cl);tm=setTimeout(function(){document.removeEventListener("visibilitychange",cl);if(!document.hidden)location.href=w},1500);location.href=xdeep(w)});

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function fmt(n){n=Number(n)||0;return n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e3?(n/1e3).toFixed(1)+'K':String(n)}
const tz={timeZone:'America/Santiago'};
let D,F='niche';
function render(){const cut=Date.now()-864e5;const ps=D.posts.filter(p=>Date.parse(p.created_at)>=cut).slice().sort((a,b)=>Date.parse(b.created_at)-Date.parse(a.created_at)).filter(p=>F==='all'||(F==='niche'?p.in_niche:!p.in_niche));
if(F==='niche'){const L={alto:3,medio:2,bajo:1};ps.sort((a,b)=>((L[(b.momentum||{}).level]||0)-(L[(a.momentum||{}).level]||0))||(((b.momentum||{}).score||0)-((a.momentum||{}).score||0))||(Date.parse(b.created_at)-Date.parse(a.created_at)));}
const el=document.getElementById('likes');
el.innerHTML=ps.length?ps.map(p=>{const m=p.m||{};const d=new Date(p.created_at).toLocaleString('es-CL',{...tz,dateStyle:'medium',timeStyle:'short'});
const rep=p.in_niche?`<div class="reply"><div class="lbl">reply/en</div><pre id="r-${p.id}">${esc(p.reply_en)}</pre></div>`:`<div class="skip"><span class="lbl">no recomendado responder:</span> ${esc(p.skip_reason)}</div>`;
const mo=p.momentum?`<div class="mo ${esc(p.momentum.level)}">[momentum <b>${esc(p.momentum.level)}</b>] ${esc(p.momentum.reason)}</div>`:'';
const vis=(p.in_niche&&p.visual)?`<div class="vis">Visual sugerido: ${esc(p.visual)}</div>`:'';
const cp=(p.in_niche&&p.reply_en)?`<span class="xbw"><a class="xb" href="${esc(xIntent(p))}" target="_blank" rel="noopener">Responder en X</a>${[...p.reply_en].length>280?`<span class="xn">más de 280 caracteres (${[...p.reply_en].length})</span>`:''}</span>`:'';
return`<article class="post${p.in_niche?'':' nr'}"><div class="meta"><span class="who">${esc(p.author)}</span> <span class="who"><span class="h">@${esc(p.username)}</span></span> · ${esc(d)}</div><div class="meta">${fmt(m.impression_count)} views · ♥ ${fmt(m.like_count)} · ↻ ${fmt(m.repost_count)} · ↩ ${fmt(m.reply_count)}</div>${mo}<div class="text">${esc(p.text)}</div>${rep}${vis}<div class="acts">${cp}<a href="${esc(p.url)}" target="_blank" rel="noopener">[abrir post ↗]</a></div></article>`}).join(''):(D.posts.some(p=>Date.parse(p.created_at)>=cut)?'<p class="sys">* nada en este filtro *</p>':'<p class="sys">* no hay posts pendientes por ahora · se actualiza a las 07:00, 11:00, 16:00 y 20:00 (Chile) *</p>');
document.querySelectorAll('[data-f]').forEach(b=>b.classList.toggle('on',b.dataset.f===F));}
(async()=>{const r=await fetch('./likes.json?ts='+Date.now());D=await r.json();const M=D.meta;const up=new Date(M.generated_at).toLocaleString('es-CL',tz);
document.getElementById('meta').textContent=`* última actualización: ${up} (Chile) *`;
{const cut=Date.now()-864e5;const v=D.posts.filter(p=>Date.parse(p.created_at)>=cut);const n=v.filter(p=>p.in_niche).length;document.getElementById('summary').textContent=`* ${v.length} pendientes · ${n} en tu nicho · ${v.length-n} no recomendado *`;}
document.getElementById('limits').textContent=`* solo lectura: nada se publica en X · posts creados en las últimas 24 h (según tu hora actual) · se revisaron tus últimos ${M.likes_scanned} likes · las respuestas son sugerencias, no consejo financiero *`;
document.querySelectorAll('[data-f]').forEach(b=>b.addEventListener('click',()=>{F=b.dataset.f;render()}));render();})();
(()=>{const h=document.documentElement,K='likesTheme';const set=t=>{h.dataset.theme=t;document.getElementById('theme-label').textContent=t;document.querySelector('meta[name=theme-color]').content=t==='day'?'#ffffff':'#000000'};try{localStorage.removeItem(K)}catch(e){}set('night');document.getElementById('theme-toggle').addEventListener('click',()=>{const n=h.dataset.theme==='night'?'day':'night';set(n)})})();
document.getElementById('xvs-refresh-btn').addEventListener('click',function(){this.disabled=true;const u=new URL(location.href);u.searchParams.set('r',Date.now());location.replace(u.toString())});
</script>
</body></html>
